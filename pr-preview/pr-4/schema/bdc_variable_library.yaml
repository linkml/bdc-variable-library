classes:
  Entity:
    name: Entity
    definition_uri: https://w3id.org/linkml/bdc-variable-library/Entity
    description: Any resource that has its own identifier
    from_schema: https://w3id.org/linkml/bdc-variable-library
    mappings:
    - schema:Thing
    abstract: true
    slots:
    - id
    class_uri: schema:Thing
  Variable:
    name: Variable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/Variable
    description: A generic grouping for any variable
    from_schema: https://w3id.org/linkml/bdc-variable-library
    is_a: Entity
    slots:
    - id
    - associated_study
    - variable_description
    - concept_type
    - variable_label
    class_uri: bdc_variable_library:Variable
  SingleContinuousVariable:
    name: SingleContinuousVariable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/SingleContinuousVariable
    description: Represents a single entry in a data dictionary of a variable with
      a continuous value
    from_schema: https://w3id.org/linkml/bdc-variable-library
    is_a: Variable
    slots:
    - id
    - associated_study
    - variable_description
    - concept_type
    - variable_label
    - source_id
    - file_id
    - file_name
    - variable_name
    - source_variable_description
    - data_type
    - minimum_value
    - maximum_value
    - resolution
    - missing_value
    - unit
    - alert_values
    - comment
    class_uri: bdc_variable_library:SingleContinuousVariable
  SingleCategoricalVariable:
    name: SingleCategoricalVariable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/SingleCategoricalVariable
    description: Represents a single entry in a data dictionary of a variable with
      a categorical value
    from_schema: https://w3id.org/linkml/bdc-variable-library
    is_a: Variable
    slots:
    - id
    - associated_study
    - variable_description
    - concept_type
    - variable_label
    - source_id
    - file_id
    - file_name
    - variable_name
    - source_variable_description
    - data_type
    - missing_value
    - coded_values
    - comment
    class_uri: bdc_variable_library:SingleCategoricalVariable
  CompoundVariable:
    name: CompoundVariable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/CompoundVariable
    description: Represents a variable and all metadata
    from_schema: https://w3id.org/linkml/bdc-variable-library
    is_a: Variable
    slots:
    - id
    - associated_study
    - variable_description
    - concept_type
    - variable_label
    - cde_id
    - bdchm_type
    - unit
    - row_metadata
    - documentation_metadata
    - alert_value
    class_uri: bdc_variable_library:CompoundVariable
  IntegratedVariable:
    name: IntegratedVariable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/IntegratedVariable
    description: Represents a variable that contains data from multiple studies. Typically,
      some or all of the data must undergo a transformation in order to be successfully
      integrated
    from_schema: https://w3id.org/linkml/bdc-variable-library
    is_a: Variable
    slots:
    - id
    - associated_study
    - variable_description
    - concept_type
    - variable_label
    - cde_id
    - bdchm_type
    - unit
    - integrates
    class_uri: bdc_variable_library:IntegratedVariable
  MissingValue:
    name: MissingValue
    definition_uri: https://w3id.org/linkml/bdc-variable-library/MissingValue
    description: Character used to indicate a missing value in a data set
    from_schema: https://w3id.org/linkml/bdc-variable-library
    slots:
    - indicator_char
    - indicator_meaning
    class_uri: bdc_variable_library:MissingValue
  AlertValue:
    name: AlertValue
    definition_uri: https://w3id.org/linkml/bdc-variable-library/AlertValue
    description: Character used to add information to a datum
    from_schema: https://w3id.org/linkml/bdc-variable-library
    slots:
    - indicator_char
    - indicator_meaning
    class_uri: bdc_variable_library:AlertValue
  EnumValue:
    name: EnumValue
    definition_uri: https://w3id.org/linkml/bdc-variable-library/EnumValue
    description: One possible answer in a list of enumerated values
    from_schema: https://w3id.org/linkml/bdc-variable-library
    slots:
    - indicator_char
    - indicator_meaning
    - indicator_type
    class_uri: bdc_variable_library:EnumValue
  MetadataVariable:
    name: MetadataVariable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/MetadataVariable
    description: Specific data point used to add information to an observation. This
      will typically be a unique identifier for a SingleVariable and a slot from a  microschema
    from_schema: https://w3id.org/linkml/bdc-variable-library
    is_a: Entity
    slots:
    - id
    - microschema_slot
    class_uri: bdc_variable_library:MetadataVariable
  DocumentationVariable:
    name: DocumentationVariable
    definition_uri: https://w3id.org/linkml/bdc-variable-library/DocumentationVariable
    description: Information derived from study documentation or text in a data dictionary
      that provides essential metadata for a variable
    from_schema: https://w3id.org/linkml/bdc-variable-library
    slots:
    - contr_vocab
    - microschema_slot
    class_uri: bdc_variable_library:DocumentationVariable
    rules:
    - preconditions:
        slot_conditions:
          microschema_slot:
            name: microschema_slot
            equals_string: instrument
      postconditions:
        slot_conditions:
          contr_vocab:
            name: contr_vocab
            range: InstrumentEnum
    - preconditions:
        slot_conditions:
          microschema_slot:
            name: microschema_slot
            equals_string: method
      postconditions:
        slot_conditions:
          contr_vocab:
            name: contr_vocab
            range: MethodEnum
    - preconditions:
        slot_conditions:
          microschema_slot:
            name: microschema_slot
            equals_string: condition_type
      postconditions:
        slot_conditions:
          contr_vocab:
            name: contr_vocab
            any_of:
            - pattern: ^MONDO:\d{7}$
            - pattern: ^HP:\d{7}$
    - preconditions:
        slot_conditions:
          microschema_slot:
            name: microschema_slot
            equals_string: condition_provenance
      postconditions:
        slot_conditions:
          contr_vocab:
            name: contr_vocab
            range: ProvenanceEnum
