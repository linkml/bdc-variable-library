    - absolute_time
    slot_usage:
      subject_identifier:
        name: subject_identifier
        required: true
      measurement_type:
        name: measurement_type
        required: true
      measurement_value:
        name: measurement_value
        required: true
      age_at_measurement:
        name: age_at_measurement
