  DataTypeEnum:
    name: DataTypeEnum
    definition_uri: https://w3id.org/linkml/clinical-microschemas/DataTypeEnum
    description: The data type of an observation value
    from_schema: https://w3id.org/linkml/clinical-microschemas
    permissible_values:
      decimal:
        text: decimal
        description: Decimal number
      integer:
        text: integer
        description: Integer number
      enum:
        text: enum
        description: Enumerated value
      boolean:
        text: boolean
        description: Boolean value
      string:
        text: string
        description: String value
      numeric:
        text: numeric
        description: decimal or integer - from dbGAP data types
      code:
        text: code
        description: data are a list of acceptable values or a controlled vocabulary,
          from dbGAP data types, same as enum
      uriorcurie:
        text: uriorcurie
        description: A URI or CURIE value
      identifier:
        text: identifier
        description: a string used as an identifier by an external data source
  MethodEnum:
    name: MethodEnum
    definition_uri: https://w3id.org/linkml/clinical-microschemas/MethodEnum
    description: The method used for a measurement or observation
    from_schema: https://w3id.org/linkml/clinical-microschemas
    permissible_values:
      anthropometry:
        text: anthropometry
        description: physical measurement of the human body, including height, weight,
          and other body dimensions
      survey:
        text: survey
        description: list of questions given to a participant for data collection
          purposes - the survey is filled out by the participant independently
      interview:
        text: interview
        description: series of questions posed to a participant by an interviewer
          for data collection purposes
      calculated:
        text: calculated
        description: clinical record that results from a calculation rather than being
          directly measured
      spirometry:
        text: spirometry
        description: breathing test used to assess lung function
      body_plesmography:
        text: body_plesmography
        description: precise pulmonary function test where the patient sits in a sealed
          chamber and breathes into a specialized mouthpiece. This method uses Boyle's
          Law  and is considered a "gold standard"
      gli:
        text: gli
        description: a standard reference range and calculator for spirometry and
          lung function tests published by the Global Lung Function Initiative in
          2012
      gli_global:
        text: gli_global
        description: a standard reference range and calculator for spirometry and
          lung function tests published by the Global Lung Function Initiative in
          2022. This is an update of the 2012 standard that is more ethnically diverse
      nhanesiii:
        text: nhanesiii
        description: standard reference equations for spirometry published in 2005
      jaffe_reaction:
        text: jaffe_reaction
        description: colorimetric method for measuring creatinine based on the Jaffe
          reaction, in which creatinine reacts with picric acid in alkaline solution
      cbc:
        text: cbc
        description: complete blood count; a common blood test that measures the cellular
          components of blood including red cells, white cells, and platelets
      plac_test:
        text: plac_test
        description: Lipoprotein-Associated Phospholipase A2 (Lp-PLA2) test; a blood
          test used to assess cardiovascular and stroke risk
      enzymatic_creatinine_assay:
        text: enzymatic_creatinine_assay
        description: enzymatic method for measuring creatinine using creatininase,
          offering greater specificity than the Jaffe reaction with fewer interferences
      lc_ms_ms:
        text: lc_ms_ms
        description: liquid chromatography-tandem mass spectrometry; a reference method
          for quantifying analytes with high specificity and sensitivity
      immunoturbidometry:
        text: immunoturbidometry
        description: photometric method measuring the turbidity caused by antigen-antibody
          complexes in suspension
      immunonephelometry:
        text: immunonephelometry
        description: optical method measuring light scatter from antigen-antibody
          complexes to quantify proteins such as albumin
      chemiluminescence_immunoassay:
        text: chemiluminescence_immunoassay
        description: immunoassay that uses a chemiluminescent label to detect and
          quantify an analyte via light emission
      elisa:
        text: elisa
        description: enzyme-linked immunosorbent assay; a plate-based immunoassay
          for detecting and quantifying proteins or antibodies
      albumin_dipstick:
        text: albumin_dipstick
        description: semi-quantitative colorimetric urine test strip method for detecting
          albumin
      hplc:
        text: hplc
        description: high-performance liquid chromatography; a chromatographic technique
          used to separate, identify, and quantify analytes in a mixture
  InstrumentEnum:
