    name: BodyMassIndexRecord
    definition_uri: https://w3id.org/linkml/clinical-microschemas/BodyMassIndexRecord
    description: 'A calculated numerical quantity representing an individual''s weight-to-height
      ratio. BMI is calculated as weight (kg) divided by height (m) squared. '
    from_schema: https://w3id.org/linkml/clinical-microschemas
    is_a: ClinicalMeasurementRecord
    slots:
    - ClinicalMeasurementRecord_subject_identifier
    - ClinicalMeasurementRecord_measurement_type
    - unit
    - method
    - instrument
    - reagent_kit
    - calculated_from
    - body_location
    - body_position
    - context
    - collected_by
    - data_type
    - ClinicalMeasurementRecord_age_at_measurement
    - study_site
    - absolute_time
    - BodyMassIndexRecord_measurement_value
    slot_usage:
      measurement_value:
        name: measurement_value
        range: BodyMassIndexQuantity
    class_uri: cms:BodyMassIndexRecord
    rules:
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            any_of:
            - equals_string: OBA:0002045455
            - equals_string: OMOP:3038553
            - equals_string: LOINC:39156-5
      postconditions:
        slot_conditions:
          unit:
            name: unit
            any_of:
            - equals_string: kg/m2
          method:
            name: method
            any_of:
            - equals_string: calculated
          data_type:
            name: data_type
            equals_string: decimal
          calculated_from:
            name: calculated_from
            any_of:
            - equals_expression: '{HumanBodyWeightRecord001} / ({HumanBodyHeightRecord001}
                / 100)^2'
            - equals_expression: '{HumanBodyWeightRecord001} / ({HumanBodyHeightRecord003}
                / 100)^2'
            - equals_expression: '{HumanBodyWeightRecord003} / ({HumanBodyHeightRecord001}
                / 100)^2'
            - equals_expression: '{HumanBodyWeightRecord004} / ({HumanBodyHeightRecord001}
                / 100)^2'
            - equals_expression: '{HumanBodyWeightRecord003} / ({HumanBodyHeightRecord003}
                / 100)^2'
            - equals_expression: '{HumanBodyWeightRecord004} / ({HumanBodyHeightRecord003}
                / 100)^2'
            - equals_expression: ({HumanBodyWeightRecord002} / 2.2) / ({HumanBodyHeightRecord002}
                / 39.37)^2
